<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Subsc — オフライン</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #1c1c1e;
        background:
          radial-gradient(circle at 12% 8%, rgba(102,186,255,.38), transparent 25rem),
          radial-gradient(circle at 92% 78%, rgba(178,143,255,.24), transparent 24rem),
          #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      main {
        width: min(100%, 390px);
        padding: 34px 28px;
        border: 1px solid rgba(255,255,255,.78);
        border-radius: 28px;
        text-align: center;
        background: rgba(255,255,255,.66);
        box-shadow: inset 0 1px 0 white, 0 22px 60px rgba(30,70,120,.14);
        backdrop-filter: blur(28px) saturate(180%);
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -.04em; }
      p { margin: 0; color: #5f5f66; font-size: 14px; line-height: 1.6; }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 24px;
        border: 0;
        border-radius: 15px;
        color: white;
        background: #007aff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/subsc-icon-192-2026.png" alt="" />
      <h1>現在オフラインです</h1>
      <p>一度オンラインでSubscを開くと、次回から保存済みの一覧をオフラインでも確認できます。</p>
      <button type="button" onclick="location.reload()">もう一度試す</button>
    </main>
  </body>
</html>
