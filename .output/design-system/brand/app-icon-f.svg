<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Subsc（つきねこ）アプリアイコン — 採用案F「金の輪の中の顔」

    座標は 1024 系で直接書いている。viewBox のスケーリングに頼らないのは、
    PNG へ変換する道具によって端数の丸め方が違い、耳の頂点が 1px ずれることがあるため。

    **不透明色だけで塗っている。** App Store 提出用の 1024 はアルファ不可で、
    内耳はもともと「金を 28% で黒に重ねた色」だった。重ねた結果の色 (#453620) を
    直接置くことで、変換側の合成の解釈に依存しなくなる。

    **耳と頭の比率は cat.html の「平常」の猫から移植した（2026-08-06）。**
    独自に起こした最初の案は、耳の付け根が頭の円の外（距離207.5 > 半径205）にあり
    **耳が頭から浮いた細い角に見え**、内耳も大きすぎて左右が
    **蝶ネクタイのようにつながって読めた**。画面の中の猫と同じ比率なら、その両方が起きない。
    付け根は2点とも頭の円の内側（196.5 と 199.3、いずれも半径205未満）で、輪郭が融合する。

    猫全体は金の輪の内側に収める。いちばん外へ出る耳の頂点で、輪の中心からの距離は 258。
    左右は中心 x=512 に対して対称。
  -->

  <!-- 地：墨 -->
  <rect width="1024" height="1024" fill="#0B0B0F"/>

  <!-- 金の輪。枠に対して直径76%で、角丸で削られる四隅を避ける -->
  <circle cx="512" cy="512" r="389" fill="#D9A43C"/>

  <!-- 耳と頭：墨。付け根を頭の円の内側へ置き、輪郭を融合させる -->
  <g fill="#0B0B0F">
    <path d="M358,451 L343,251 L522,374 Z"/>
    <path d="M666,451 L681,251 L502,374 Z"/>
    <circle cx="512" cy="573" r="205"/>
  </g>

  <!-- 内耳：金28%を墨へ重ねた色。
       **cat.html の比率から0.75倍に縮めてある。** 等倍だと左右の内耳が中央で
       向き合い、**蝶ネクタイのようなV字に読めた**。画面の中の猫は目・鼻・口があって
       内耳が埋もれるが、アイコンは顔の要素が目と内耳しかないぶん内耳が目立つ。
       中央の隙間を62pxから94pxへ広げて分離させた。 -->
  <path d="M396,407 L388,322 L465,376 Z" fill="#453620"/>
  <path d="M628,407 L636,322 L559,376 Z" fill="#453620"/>

  <!-- 金目 -->
  <ellipse cx="440" cy="563" rx="41" ry="56" fill="#F2C96B"/>
  <ellipse cx="584" cy="563" rx="41" ry="56" fill="#F2C96B"/>
</svg>
