<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Subsc アプリアイコン — 採用案F「金の輪の中の顔」

    座標は 1024 系で直接書いている。viewBox のスケーリングに頼らないのは、
    PNG へ変換する道具によって端数の丸め方が違い、耳の頂点が 1px ずれることがあるため。

    **不透明色だけで塗っている。** App Store 提出用の 1024 はアルファ不可で、
    内耳はもともと「金を 28% で黒に重ねた色」だった。重ねた結果の色 (#453620) を
    直接置くことで、変換側の合成の解釈に依存しなくなる。

    **猫は輪の内側に完全に収める。** 検討時の案は耳の頂点が輪をはみ出しており、
    墨の地に墨の耳が溶けて「金の輪が欠けている」ようにしか見えなかった。
    いちばん外へ出る耳の頂点で、中心からの距離が 301 と輪の半径 389 を下回る。

    左右は中心 x=512 に対して対称。検討時の案は非対称だった（作図のミス）。
  -->

  <!-- 地：墨 -->
  <rect width="1024" height="1024" fill="#0B0B0F"/>

  <!-- 金の輪。枠に対して直径76%で、角丸で削られる四隅を避ける -->
  <circle cx="512" cy="512" r="389" fill="#D9A43C"/>

  <!-- 耳と頭：墨。耳の付け根は頭の円周上に置き、輪郭を融合させる -->
  <g fill="#0B0B0F">
    <path d="M317,502 L338,266 L512,369 Z"/>
    <path d="M707,502 L686,266 L512,369 Z"/>
    <circle cx="512" cy="573" r="205"/>
  </g>

  <!-- 内耳：金28%を墨へ重ねた色 -->
  <path d="M353,471 L364,307 L481,379 Z" fill="#453620"/>
  <path d="M671,471 L660,307 L543,379 Z" fill="#453620"/>

  <!-- 金目 -->
  <ellipse cx="440" cy="563" rx="41" ry="56" fill="#F2C96B"/>
  <ellipse cx="584" cy="563" rx="41" ry="56" fill="#F2C96B"/>
</svg>
